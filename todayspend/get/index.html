<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>오늘지출 받기</title>
<meta property="og:title" content="오늘지출 - 지출만 기록하는 가계부">
<meta property="og:image" content="https://techiemaru.com/img/todayspend-icon.png">
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/style.css?v=20261118">
<script>
// 휴대폰 종류를 보고 맞는 스토어로 바로 보낸다 (컴퓨터는 버튼 두 개를 보여 준다)
(function () {
  var ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (ios) location.replace("https://apps.apple.com/app/id6824415997");
  else if (/Android/.test(ua)) location.replace("https://play.google.com/store/apps/details?id=com.techiemaru.todayspend");
})();
</script>
</head>
<body>
<main>
  <section class="app-hero">
    <img class="app-icon" src="/img/todayspend-icon.png" alt="" width="88" height="88">
    <h1>오늘지출</h1>
    <p class="sub">지출만 기록하는 가계부</p>
    <div class="store-buttons">
      <a class="store-btn" href="https://apps.apple.com/app/id6824415997">App Store에서 받기</a>
      <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.techiemaru.todayspend">Google Play에서 받기</a>
    </div>
    <p class="muted"><a href="/todayspend/">앱 소개 보기</a></p>
  </section>
</main>
</body>
</html>
